<!doctype html>
<!-- modified by jinlong.feng at 2026-11-20 KF开发助手M1开工与交互设计 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KF 开发中心 · 开发助手交互稿</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17283e;
        --muted: #53677c;
        --line: #d9e2ed;
        --blue: #2458bb;
        --tint: #eef4ff;
        --paper: #fff;
        --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
        font:
          14px/1.55 'PingFang SC',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
        color: var(--ink);
        background: #f2f5fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid #608af2;
        outline-offset: 2px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button {
        background: transparent;
        border: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 25px;
        letter-spacing: -0.04em;
      }
      h2 {
        font-size: 18px;
      }
      h3 {
        font-size: 15px;
      }
      small,
      .sub {
        font-size: 12px;
        color: var(--muted);
      }
      code,
      pre,
      .mono {
        font: 13px/1.65 var(--mono);
        overflow-wrap: anywhere;
      }
      code {
        color: #214c82;
      }
      button,
      .token {
        transition:
          background 0.15s,
          color 0.15s;
      }
      header {
        height: 62px;
        background: #fbfcff;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 21px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font: italic 800 21px/1 system-ui;
        color: #fff;
        background: #2357b5;
        padding: 7px 9px;
        border-radius: 5px;
        letter-spacing: -2px;
      }
      .product {
        font-size: 17px;
        font-weight: 650;
      }
      .grow {
        flex: 1;
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .state:before {
        content: '';
        height: 7px;
        width: 7px;
        border-radius: 50%;
        background: #56789a;
      }
      .action,
      .quiet,
      .primary,
      .icon {
        border-radius: 5px;
        padding: 6px 11px;
      }
      .action {
        color: var(--blue);
        background: #e7efff;
      }
      .quiet,
      .icon {
        border: 1px solid var(--line);
        background: white;
      }
      .quiet:hover,
      .icon:hover,
      .token:hover {
        background: #f1f5fb;
      }
      .primary {
        color: white;
        background: var(--blue);
      }
      .primary:hover {
        background: #184491;
      }
      .icon {
        padding: 2px 8px;
        font-size: 18px;
      }
      .desk {
        display: grid;
        grid-template-columns: 172px minmax(260px, 1fr) minmax(370px, 425px);
        height: calc(100dvh - 62px);
        min-height: 440px;
      }
      .desk.closed {
        grid-template-columns: 172px minmax(0, 1fr);
      }
      .desk.closed aside {
        display: none;
      }
      nav {
        background: #eaf0fc;
        border-right: 1px solid #d4deed;
        padding: 23px 12px;
      }
      .nav-label {
        font-size: 12px;
        color: #52687e;
        margin: 0 0 12px 8px;
      }
      .project {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 9px 10px;
        border-radius: 5px;
        text-align: left;
        margin-bottom: 5px;
      }
      .project:hover {
        background: #e0e9f9;
      }
      .project[aria-pressed='true'] {
        color: #194ba5;
        background: #d5e4ff;
        font-weight: 650;
      }
      .project-mark {
        width: 19px;
        height: 16px;
        border: 1.5px solid currentColor;
        border-radius: 3px;
        display: inline-grid;
        place-content: center;
        font: 10px/1 var(--mono);
      }
      main {
        padding: 26px clamp(16px, 2.5vw, 40px);
        overflow: auto;
        min-width: 0;
      }
      .crumb {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      .page-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .card-top,
      .section-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 16px;
      }
      .card-top {
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .workspace {
        display: grid;
        place-items: center;
        min-height: 230px;
        padding: 20px;
        background-color: #f6f8fc;
        background-image: radial-gradient(#ccd7e5 0.8px, transparent 0.8px);
        background-size: 14px 14px;
      }
      .instrument {
        background: #fff;
        border: 1px solid #a6bce4;
        outline: 1px dashed #85a4d7;
        outline-offset: 5px;
        width: min(100%, 300px);
        padding: 15px 18px;
        box-shadow: 0 5px 16px #2539540e;
      }
      .instrument .measure {
        font: 500 42px/1.2 var(--mono);
        margin: 12px 0;
      }
      .measure span {
        font-size: 15px;
        color: var(--muted);
      }
      .object-name {
        color: var(--blue);
        font-size: 12px;
      }
      .codeview {
        padding: 16px;
        background: #23334a;
        color: #e1eaf5;
        border-radius: 6px;
        width: 100%;
        white-space: pre-wrap;
      }
      .props {
        margin-top: 22px;
      }
      .props dl {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 0;
        margin: 8px 0;
      }
      .props dt,
      .props dd {
        margin: 0;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .props dt {
        font-size: 13px;
        color: var(--muted);
      }
      .props dd {
        overflow-wrap: anywhere;
      }
      aside {
        min-width: 0;
        background: #fff;
        border-left: 1px solid #cdd8e6;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel-head {
        padding: 17px 19px 10px;
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .assistant-mark {
        color: var(--blue);
        background: var(--tint);
        border-radius: 6px;
        width: 29px;
        height: 29px;
        display: grid;
        place-content: center;
        font-weight: bold;
      }
      .context {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 9px;
        background: #f3f6fa;
        border-radius: 5px;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .tabs {
        display: flex;
        gap: 21px;
        padding: 0 19px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        padding: 9px 0;
        border-bottom: 2px solid transparent;
      }
      .tabs .selected {
        color: var(--blue);
        border-color: var(--blue);
        font-weight: 600;
      }
      .panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 16px 18px;
        scrollbar-width: thin;
      }
      .panel-body > * + * {
        margin-top: 14px;
      }
      .conversation-name {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
      }
      .conversation-name h3 {
        overflow-wrap: anywhere;
      }
      .user-message {
        margin-left: 32px;
        background: #edf3ff;
        border-radius: 8px 8px 2px 8px;
        padding: 10px 12px;
      }
      .reply {
        padding-right: 4px;
      }
      .reply p {
        margin-top: 6px;
      }
      .reply-label {
        font-size: 12px;
        color: var(--blue);
        font-weight: 650;
      }
      details {
        border-left: 2px solid #c1d4ef;
        padding: 3px 0 3px 9px;
        margin-top: 9px;
      }
      summary {
        color: #29558c;
        cursor: pointer;
        font-size: 13px;
      }
      details .details-text {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        margin-top: 6px;
        overflow-wrap: anywhere;
      }
      .offer {
        background: #f7f9fd;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 12px;
        margin-top: 10px;
      }
      .offer p {
        margin: 5px 0 9px;
      }
      .actions {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
      }
      .decision {
        font-size: 12px;
        color: #416687;
      }
      .composer {
        padding: 10px 16px 13px;
        border-top: 1px solid var(--line);
      }
      .suggest {
        color: var(--blue);
        padding: 2px 0;
        margin-bottom: 7px;
        font-size: 12px;
      }
      .input-wrap {
        padding: 8px;
        border: 1px solid #bdcce0;
        border-radius: 7px;
      }
      .input-wrap textarea {
        width: 100%;
        resize: vertical;
        min-height: 36px;
        border: 0;
        background: transparent;
        color: var(--ink);
      }
      .input-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .footnote {
        font-size: 11px;
        color: var(--muted);
      }
      .rowbtn {
        display: block;
        width: 100%;
        text-align: left;
        border-bottom: 1px solid var(--line);
        padding: 11px 0;
      }
      .rowbtn:hover {
        color: var(--blue);
      }
      .list {
        margin: 0;
        padding-left: 21px;
      }
      .list li {
        padding: 6px 0;
      }
      .empty {
        margin: 22px 0;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      .sr {
        position: absolute;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .revealed {
        animation: reveal 0.16s ease-out;
      }
      @keyframes reveal {
        from {
          opacity: 0.3;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-width: 1050px) {
        .desk {
          grid-template-columns: 128px minmax(200px, 1fr) 365px;
        }
        .desk.closed {
          grid-template-columns: 128px 1fr;
        }
        main {
          padding: 20px 15px;
        }
        nav {
          padding: 20px 6px;
        }
        .instrument {
          max-width: 245px;
        }
      }
      @media (max-width: 760px) {
        header {
          height: 54px;
          padding: 0 10px;
          gap: 7px;
        }
        .product {
          font-size: 14px;
        }
        .account {
          display: none;
        }
        .desk,
        .desk.closed {
          height: calc(100dvh - 54px);
          display: flex;
          flex-direction: column;
          min-height: 0;
        }
        .desk:has(aside:not([hidden])):not(.closed) main {
          display: none;
        }
        nav {
          display: flex;
          gap: 5px;
          padding: 4px 10px;
          border-bottom: 1px solid var(--line);
          border-right: 0;
        }
        .nav-label {
          display: none;
        }
        .project {
          width: auto;
          margin: 0;
          padding: 5px 8px;
        }
        aside {
          border: 0;
          flex: 1;
        }
        .desk.closed main {
          display: block;
        }
        main {
          padding: 12px;
        }
        .panel-head {
          padding: 10px 14px 6px;
        }
        .panel-body {
          padding: 12px 14px;
        }
        .context {
          margin-top: 6px;
        }
        .tabs button {
          padding: 6px 0;
        }
        .composer {
          padding: 6px 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      .scenario {
        max-width: 132px;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: white;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
      }
      .notice {
        margin: 0 18px 8px;
        padding: 8px 10px;
        border-left: 2px solid #9c7028;
        background: #fff7e8;
        color: #675022;
        font-size: 12px;
      }
      .check-step {
        font-size: 13px;
      }
      @media (max-width: 500px) {
        .scenario {
          max-width: 93px;
        }
        .product {
          font-size: 12px;
        }
        .brand {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand" aria-hidden="true">KF</span><strong class="product">KingFusion 开发中心</strong
      ><span class="grow"></span
      ><select id="scenario" class="scenario" aria-label="交互稿预览场景">
        <option value="normal">场景 · 正常</option>
        <option value="empty">未进入工程</option>
        <option value="draft">有未保存草稿</option>
        <option value="revoked">工程权限已撤回</option>
        <option value="offline">模型服务离线</option></select
      ><button class="action" id="open-panel" aria-controls="assistant">开发助手</button
      ><span class="small account">演示开发员</span>
    </header>
    <div class="desk" id="desk">
      <nav aria-label="切换工程入口">
        <p class="nav-label">供水站压力监控</p>
        <button class="project" data-entry="hmi"><span class="project-mark">▦</span>客户端工程</button
        ><button class="project" data-entry="calc"><span class="project-mark">ƒ</span>计算工程</button>
      </nav>
      <main id="work" aria-label="当前工程"></main>
      <aside id="assistant" aria-label="开发助手">
        <div class="panel-head">
          <div class="panel-title">
            <span class="assistant-mark" aria-hidden="true">✦</span>
            <h2>开发助手</h2>
            <span class="grow"></span><button class="icon" aria-label="收起助手" id="close-panel">×</button>
          </div>
          <div class="context" id="context"></div>
        </div>
        <div class="notice" id="notice" role="status" hidden></div>
        <div class="tabs" role="group" aria-label="助手视图">
          <button data-tab="chat">对话</button><button data-tab="plan">方案清单</button
          ><button data-tab="history">历史</button>
        </div>
        <div class="panel-body" id="content"></div>
        <form class="composer" id="composer">
          <button class="suggest" type="button" id="suggest"></button>
          <div class="input-wrap">
            <textarea
              id="question"
              aria-label="给开发助手的消息"
              placeholder="输入与当前工程相关的问题…"
              rows="1"
            ></textarea>
            <div class="input-bottom">
              <span class="footnote">离线交互稿 · 使用示例答复</span
              ><button class="primary" type="submit">发送 ↑</button>
            </div>
          </div>
        </form>
      </aside>
    </div>
    <div class="sr" id="announce" role="status" aria-live="polite"></div>
    <script>
      const catalog = {
        hmi: {
          kind: '客户端工程',
          project: 'WaterHMIGuide1120',
          section: '页面管理',
          parent: 'StationPressure',
          object: 'PressureValue',
          id: 'hmi-0901d0a5',
          prompt: '这个控件的压力从哪里来？',
          evidence:
            '页面脚本读取 $System.P_OUT。工程变量已订阅，连接 Rt 的 appName 为 WaterRTGuideA1120，源点为 P_OUT。',
        },
        calc: {
          kind: '计算工程',
          project: 'WaterCalcGuide1120',
          section: '周期性脚本',
          parent: '周期性脚本',
          object: 'PressureAverage',
          id: 'calc-1283ff17',
          prompt: '这段脚本读什么，写到哪里？',
          evidence: '周期脚本从 Rt 读取 P_OUT，写入 P_AVG5_TEXT。工程内连接 Rt 解析到 WaterRTGuideA1120。',
        },
      };
      const proposalText = '客户端压力显示和周期计算共用实时源的 P_OUT 输入，计算结果写回 P_AVG5_TEXT。';
      const storeKey = 'kf-design-m1-local-v1';
      const byId = (id) => document.getElementById(id);
      const escapeText = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char],
        );
      let entry = 'hmi',
        tab = 'chat',
        panelOpen = true,
        storageAvailable = true;
      function initialState() {
        return {
          revision: 0,
          items: [],
          active: 1,
          chats: [
            {
              id: 1,
              name: '压力数据从哪里来',
              messages: [{ question: catalog.hmi.prompt, entry: 'hmi', type: 'trace' }],
            },
          ],
        };
      }
      let state;
      try {
        state = JSON.parse(localStorage.getItem(storeKey)) || initialState();
      } catch {
        state = initialState();
        storageAvailable = false;
      }
      const activeChat = () => state.chats.find((chat) => chat.id === state.active);
      if (Object.hasOwn(catalog, state.lastEntry)) entry = state.lastEntry;
      const scene = () => byId('scenario').value;
      const blocked = () => ['revoked', 'empty', 'offline'].includes(scene());
      const notices = {
        empty: '可查看个人方案和历史。选择左侧工程后即可查询对象。',
        draft: '当前编辑器有未保存修改。本轮证据取自上次保存，草稿内容尚无读回。',
        revoked: '当前工程权限已撤回，相关对象及引用详情已收起。',
        offline: '模型服务暂不可用。可继续查看历史和清单，输入草稿会保留。',
      };
      function save() {
        try {
          localStorage.setItem(storeKey, JSON.stringify(state));
        } catch {
          storageAvailable = false;
        }
      }
      function notify(message) {
        byId('announce').textContent = message;
      }
      function showWork() {
        const data = catalog[entry],
          hmi = entry === 'hmi';
        byId('work').innerHTML =
          '<div class="crumb">开发中心　/　' +
          data.kind +
          '　/　' +
          data.section +
          '</div><div class="title-row"><div><h1>' +
          data.object +
          '</h1><span class="sub mono">' +
          data.project +
          '</span></div><button class="quiet" id="ask-object">询问此对象</button></div><section class="page-card"><div class="card-top"><strong>' +
          (hmi ? '二维页面预览' : '周期脚本摘录') +
          '</strong><span class="state sub">已保存配置</span></div><div class="workspace">' +
          (hmi
            ? '<div class="instrument"><div class="object-name mono">StationPressure</div><h3>出口压力</h3><div class="measure">— <span>kPa</span></div><small>设计预览 · 运行读数待核验</small></div>'
            : '<pre class="codeview">const source = "Rt";\nconst inputTag = "P_OUT";\nconst outputTag = "P_AVG5_TEXT";</pre>') +
          '</div></section><section class="props"><h3>对象属性</h3><dl><dt>对象</dt><dd><code>' +
          data.object +
          '</code></dd><dt>来源</dt><dd>' +
          (hmi ? data.section + ' / ' + data.parent : data.section) +
          '</dd><dt>工程内连接</dt><dd><code>Rt</code></dd></dl></section>';
        byId('context').innerHTML =
          '<strong>当前对象</strong><span>' + data.kind + ' / <code>' + data.object + '</code></span>';
        if (['empty', 'revoked'].includes(scene())) {
          const text = scene() === 'empty' ? '尚未进入工程' : '工程不可见';
          byId('work').innerHTML =
            '<div class="crumb">开发中心</div><h1>' +
            text +
            '</h1><p class="empty">' +
            notices[scene()] +
            '</p>';
          byId('context').textContent = text;
        }
        document
          .querySelectorAll('[data-entry]')
          .forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.entry === entry)));
        byId('suggest').textContent =
          '↳ ' +
          (entry === 'calc' && activeChat().messages.some((m) => m.entry === 'hmi' && m.type === 'trace')
            ? '和上轮控件共用输入吗？'
            : data.prompt);
      }
      function evidence(kind) {
        const data = catalog[kind];
        return (
          '<details><summary>已保存配置 · ' +
          data.id +
          '</summary><div class="details-text"><strong>' +
          data.project +
          ' / ' +
          data.object +
          '</strong><br>' +
          data.evidence +
          '<br>来源：M0 案例读回。当前运行值未核验。</div></details>'
        );
      }
      function offerMarkup(message, index) {
        if (!message.offer) return '';
        if (message.offer.status === 'confirmed')
          return '<p class="decision">已由本人确认 · 第 ' + message.offer.applied + ' 版</p>';
        if (message.offer.status === 'rejected')
          return '<p class="decision">已拒绝 · 正式清单保留原版本</p>';
        if (message.offer.base !== state.revision)
          return '<p class="decision">此提议基于旧版本。请查看当前方案。</p>';
        return (
          '<div class="offer"><small>待本人确认 · 基于第 ' +
          message.offer.base +
          ' 版</small><p><strong>新增一项</strong>　' +
          proposalText +
          '</p><div class="actions"><button class="primary" data-confirm="' +
          index +
          '">确认加入清单</button><button class="quiet" data-reject="' +
          index +
          '">拒绝</button></div></div>'
        );
      }
      function messageMarkup(message, index) {
        if (scene() === 'revoked') return '<p class="decision">工程引用已收起 · 当前账号无权查看</p>';
        let answer = '',
          proof = '';
        if (message.type === 'trace') {
          answer =
            message.entry === 'hmi'
              ? '读的是实时源的 <code>P_OUT</code>。页面控件通过已订阅的工程变量取值，连接别名为 <code>Rt</code>。'
              : '周期脚本读取 <code>P_OUT</code>，将结果写回 <code>P_AVG5_TEXT</code>。两个点的用途不同。';
          if (message.compare) answer += ' 与上轮客户端控件使用同一实时源和输入点。';
          proof = (message.compare ? evidence('hmi') : '') + evidence(message.entry);
          proof +=
            '<p class="check-step"><strong>在界面核对</strong>　' +
            (message.entry === 'hmi'
              ? '打开「工程变量」，核对 P_OUT 的订阅与 Rt 连接。'
              : '打开「脚本 → 周期性脚本」，双击 PressureAverage，核对读取与写回点名。') +
            '</p>';
        } else if (message.type === 'runtime') {
          answer =
            '现有材料只有已保存配置。请先核对目标 App、点质量与采样时间，取得运行证据后才能回答当前值。';
        } else {
          answer = '交互稿提供当前控件或周期脚本的引用示例。可点输入框上方的问题继续。';
        }
        return (
          '<div class="user-message">' +
          escapeText(message.question) +
          '</div><div class="reply"><div class="reply-label">开发助手 · ' +
          catalog[message.entry].kind +
          '</div><p>' +
          answer +
          '</p>' +
          proof +
          offerMarkup(message, index) +
          '</div>'
        );
      }
      function render(scrollEnd = false) {
        showWork();
        byId('desk').classList.toggle('closed', !panelOpen);
        byId('open-panel').setAttribute('aria-expanded', String(panelOpen));
        const chat = activeChat(),
          content = byId('content');
        document.querySelectorAll('[data-tab]').forEach((button) => {
          button.classList.toggle('selected', button.dataset.tab === tab);
          button.setAttribute('aria-pressed', String(button.dataset.tab === tab));
        });
        byId('composer').hidden = tab !== 'chat';
        byId('question').value = chat.drafts?.[entry] || '';
        byId('suggest').hidden = blocked();
        byId('composer').querySelector('[type=submit]').disabled = blocked();
        byId('notice').textContent = notices[scene()] || '';
        byId('notice').hidden = scene() === 'normal';
        if (tab === 'chat')
          content.innerHTML =
            '<div class="conversation-name"><h3>' +
            escapeText(chat.name) +
            '</h3><small>' +
            (storageAvailable ? '本机示例' : '仅本次打开') +
            '</small></div><small>个人方案 / 供水站压力监控</small>' +
            (chat.messages.length
              ? chat.messages.map(messageMarkup).join('')
              : '<p class="empty">这段对话尚无消息。可从当前工程开始提问。</p>');
        if (tab === 'plan')
          content.innerHTML =
            '<div class="conversation-name"><h2>供水站压力监控</h2><small>第 ' +
            state.revision +
            ' 版</small></div><small>本人的已确认清单 · ' +
            state.items.length +
            ' 项</small>' +
            (state.items.length
              ? '<ol class="list">' +
                state.items
                  .map(
                    (item) =>
                      '<li>' + (scene() === 'revoked' ? '关联工程不可见' : escapeText(item)) + '</li>',
                  )
                  .join('') +
                '</ol>'
              : '<p class="empty">尚无已确认条目。对话中的提议会等待你的决定。</p>') +
            '<button class="quiet" data-new>在此方案新开对话</button>';
        if (tab === 'history')
          content.innerHTML =
            '<div class="conversation-name"><h2>方案对话</h2><button class="quiet" data-new>新对话</button></div><small>供水站压力监控 · 本人</small>' +
            state.chats
              .slice()
              .reverse()
              .map(
                (c) =>
                  '<button class="rowbtn" data-chat="' +
                  c.id +
                  '"><strong>' +
                  escapeText(c.name) +
                  '</strong><br><small>' +
                  c.messages.length +
                  ' 轮' +
                  (c.id === state.active ? ' · 当前对话' : '') +
                  '</small></button>',
              )
              .join('');
        if (scrollEnd) content.scrollTop = content.scrollHeight;
        else content.scrollTop = 0;
      }
      function send(question) {
        question = question.trim();
        if (!question || blocked()) return;
        const chat = activeChat();
        const suggested = byId('suggest').textContent.slice(2);
        const type = /实际|实时值|当前值|运行值/.test(question)
          ? 'runtime'
          : question === suggested || question === catalog[entry].prompt
            ? 'trace'
            : 'uncovered';
        const compare =
          type === 'trace' &&
          entry === 'calc' &&
          chat.messages.some((m) => m.entry === 'hmi' && m.type === 'trace');
        const message = { question, entry, type, compare };
        if (
          compare &&
          !state.items.includes(proposalText) &&
          !chat.messages.some(
            (m) => m.offer && m.offer.status === 'pending' && m.offer.base === state.revision,
          )
        )
          message.offer = { base: state.revision, status: 'pending' };
        if (!chat.messages.length) chat.name = question.slice(0, 20);
        chat.messages.push(message);
        if (chat.drafts) delete chat.drafts[entry];
        byId('question').value = '';
        save();
        render(true);
        notify('已添加示例答复');
      }
      function focusCurrentTab() {
        document.querySelector('[data-tab="' + tab + '"]').focus();
      }
      document.addEventListener('click', (event) => {
        const b = event.target.closest('button');
        if (!b) return;
        if (b.dataset.entry) {
          entry = b.dataset.entry;
          state.lastEntry = entry;
          if (scene() === 'empty') byId('scenario').value = 'normal';
          save();
          render();
          notify('当前对象已切换，对话已保留');
        } else if (b.dataset.tab) {
          tab = b.dataset.tab;
          render();
        } else if (b.id === 'open-panel' || b.id === 'ask-object') {
          panelOpen = true;
          if (b.id === 'ask-object') tab = 'chat';
          render();
          focusCurrentTab();
        } else if (b.id === 'close-panel') {
          panelOpen = false;
          render();
          byId('open-panel').focus();
        } else if (b.id === 'suggest') {
          send(b.textContent.slice(2));
        } else if (b.hasAttribute('data-new')) {
          const id = 1 + Math.max(...state.chats.map((c) => c.id));
          state.chats.push({ id, name: '新对话', messages: [] });
          state.active = id;
          tab = 'chat';
          save();
          render();
          byId('question').focus();
        } else if (b.dataset.chat) {
          state.active = Number(b.dataset.chat);
          tab = 'chat';
          save();
          render();
          focusCurrentTab();
        } else if (b.hasAttribute('data-confirm') || b.hasAttribute('data-reject')) {
          const confirm = b.hasAttribute('data-confirm'),
            offer = activeChat().messages[Number(confirm ? b.dataset.confirm : b.dataset.reject)].offer;
          if (offer.status !== 'pending' || offer.base !== state.revision) return;
          if (confirm) {
            state.items.push(proposalText);
            offer.applied = ++state.revision;
          }
          offer.status = confirm ? 'confirmed' : 'rejected';
          save();
          render(true);
          notify(confirm ? '已更新个人方案' : '已拒绝提议');
          focusCurrentTab();
        }
      });
      byId('composer').addEventListener('submit', (event) => {
        event.preventDefault();
        send(byId('question').value);
      });
      byId('scenario').addEventListener('change', () => {
        render();
        notify(notices[scene()] || '已恢复正常场景');
      });
      byId('question').addEventListener('input', (event) => {
        const chat = activeChat();
        chat.drafts ??= {};
        chat.drafts[entry] = event.target.value;
        save();
      });
      byId('question').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          send(event.target.value);
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && panelOpen) byId('close-panel').click();
      });
      render();
    </script>
  </body>
</html>
